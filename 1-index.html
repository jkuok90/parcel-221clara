  #parcel-startup { width:min(100%,440px); margin:auto; padding:24px 16px; display:grid; gap:12px; font-family:'Satoshi',Arial,sans-serif; color:var(--color-text,#29312d); }

  #parcel-startup h1,#parcel-startup p,#parcel-startup noscript { font-size:14px; line-height:1.5; }
  #parcel-startup details { font-size:12px; overflow-wrap:anywhere; }

<section id="parcel-startup" role="status" aria-live="polite" data-testid="google-startup">

</section>
<script id="parcel-startup-guard">
(function () {
  var ready = false;
  var timer;
  var panel = document.getElementById("parcel-startup");
  function fail(message) {
    if (ready) return;
    clearTimeout(timer);
    panel.hidden = false;
    document.getElementById("parcel-startup-title").textContent = "Couldn't open the form.";
    var hint = document.getElementById("parcel-startup-message");
    hint.textContent = "Refresh this page.";
    hint.hidden = false;
    document.getElementById("parcel-startup-error").textContent = "Build d11548d55730\n" + String(message || "Startup failed.").slice(0,600);
    document.getElementById("parcel-startup-details").hidden = false;
  }
  window.__parcelBoot = {
    rendered: function () { ready = true; clearTimeout(timer); panel.hidden = true; },
    failed: fail
  };
  window.addEventListener("error",function (event) { if (event.message) fail(event.message); });
  window.addEventListener("unhandledrejection",function (event) {
    var reason = event.reason;
    fail(reason && reason.message ? reason.message : "Startup failed.");
  });
  timer = setTimeout(function () { fail("The app did not render within 15 seconds."); },15000);
})();
</script>
